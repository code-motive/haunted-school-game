<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Haunted School 3D - TV Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* TV HUD overlay */
    #hud {
      position: absolute;
      top: 30px;
      left: 40px;
      color: #fff;
      text-shadow: 2px 2px 8px #000;
      z-index: 10;
    }
    #prompt-box {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 3px solid #ffcc00;
      border-radius: 12px;
      padding: 20px 40px;
      color: #fff;
      font-size: 28px;
      text-align: center;
      max-width: 80%;
      z-index: 10;
    }
    .tv-hint {
      font-size: 18px;
      color: #aaa;
      margin-top: 8px;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <h1 style="font-size: 36px; color: #ff4444;">🏫 Haunted School</h1>
      <p id="score" style="font-size: 24px;">સંગ્રહિત શબ્દો (Collected Words): 0</p>
    </div>

    <div id="prompt-box">
      <div id="question-text">વર્ગખંડમાં સાચો શબ્દ શોધો (Find the correct word in classroom)</div>
      <div class="tv-hint">[D-Pad: Halvo/Khasto (Move) | Center Enter: Interact | Return: Exit]</div>
    </div>
  </div>

  <script src="tv-controls.js"></script>
  <script src="game-3d.js"></script>
</body>
</html>
