                fullText: '"જો અન્ય પરિબળો યથાવત રહે તો વસ્તુની કિંમત ઘટતાં માંગનું વિસ્તરણ થાય અને વસ્તુની કિંમત વધતાં માંગનું સંકોચન થાય છે આમ માંગ અને કિંમત વચ્ચે વ્યસ્ત સંબંધ છે"'

        let currentDefKey = "demand";

        // --- 2. THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x02040a);
        scene.fog = new THREE.FogExp2(0x030612, 0.022);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Ambient & Directional Lighting
        const ambientLight = new THREE.AmbientLight(0x2a3650, 1.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0x5588cc, 1.6);
        mainLight.position.set(35, 60, 25);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        const d = 45;
        mainLight.shadow.camera.left = -d;
        mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d;
        mainLight.shadow.camera.bottom = -d;
        scene.add(mainLight);

        // Ground Mesh
        const groundGeo = new THREE.PlaneGeometry(100, 100, 32, 32);
        const groundMat = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Group Containers for Environment Props
        const envPropsGroup = new THREE.Group();
        scene.add(envPropsGroup);

        const obstacleGroup = new THREE.Group();
        scene.add(obstacleGroup);

        // --- 3. DYNAMIC PROCEDURAL ENVIRONMENT BUILDER ---
        function generateProceduralTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            if (type === 'market') {
                // Village Mud & Straw Floor
                ctx.fillStyle = '#2b1d0e';
                ctx.fillRect(0, 0, 512, 512);
                for (let i = 0; i < 600; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#3a2815' : '#1e1307';
                    ctx.fillRect(Math.random()*512, Math.random()*512, Math.random()*12+2, Math.random()*12+2);
                }
            } else if (type === 'jungle') {
                // Jungle Moss & Earth
                ctx.fillStyle = '#0f1f0a';
                ctx.fillRect(0, 0, 512, 512);
                for (let i = 0; i < 800; i++) {
                    ctx.fillStyle = Math.random() > 0.4 ? '#183311' : '#081205';
                    ctx.beginPath();
                    ctx.arc(Math.random()*512, Math.random()*512, Math.random()*8+2, 0, Math.PI*2);
                    ctx.fill();
                }
            } else {
                // Haunted Courtyard Stone Tiles
                ctx.fillStyle = '#111622';
                ctx.fillRect(0, 0, 512, 512);
                const tileSize = 32;
                for (let x = 0; x < 512; x += tileSize) {
                    for (let y = 0; y < 512; y += tileSize) {
                        const noise = (Math.random() - 0.5) * 20;
                        ctx.fillStyle = `rgb(${18 + noise}, ${24 + noise}, ${36 + noise})`;
                        ctx.fillRect(x + 1, y + 1, tileSize - 2, tileSize - 2);
                    }
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(12, 12);
            return texture;
        }

        const flickeringLights = [];

        function buildEnvironment(theme) {
            // Clear previous env props
            while(envPropsGroup.children.length > 0) {
                envPropsGroup.remove(envPropsGroup.children[0]);
            }
            flickeringLights.length = 0;

            groundMat.map = generateProceduralTexture(theme);
            groundMat.needsUpdate = true;

            if (theme === 'market') {
                // VILLAGE MARKET ENVIRONMENT
                scene.background.setHex(0x0c0702);
                scene.fog.color.setHex(0x0c0702);
                ambientLight.color.setHex(0x664422);
                mainLight.color.setHex(0xffaa55);

                const stallMat = new THREE.MeshStandardMaterial({ color: 0x5c3a1e, roughness: 0.9 });
                const clothMat = new THREE.MeshStandardMaterial({ color: 0xb53c2a, roughness: 0.6 });

                for (let x = -30; x <= 30; x += 20) {
                    for (let z = -30; z <= 30; z += 30) {
                        const stall = new THREE.Group();
                        stall.position.set(x, 0, z);

                        const roof = new THREE.Mesh(new THREE.ConeGeometry(2.5, 1.2, 4), clothMat);
                        roof.position.y = 3.2;
                        roof.rotation.y = Math.PI / 4;
                        stall.add(roof);

                        const table = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 1.8), stallMat);
                        table.position.y = 0.8;
                        stall.add(table);

                        envPropsGroup.add(stall);

                        const lantern = new THREE.PointLight(0xffaa22, 2.0, 12);
                        lantern.position.set(x, 2.8, z);
                        envPropsGroup.add(lantern);
                        flickeringLights.push(lantern);
                    }
                }
            } else if (theme === 'jungle') {
                // ANCIENT JUNGLE ENVIRONMENT
                scene.background.setHex(0x020a04);
                scene.fog.color.setHex(0x020a04);
                ambientLight.color.setHex(0x225533);
                mainLight.color.setHex(0x44aa77);

                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3a2512, roughness: 0.95 });
                const leafMat = new THREE.MeshStandardMaterial({ color: 0x114411, roughness: 0.8 });

                for (let x = -35; x <= 35; x += 15) {

        function createGujaratiWord3D(wordText, index, isTarget) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 140;

            function drawCard(revealed, textToDisplay) {
                ctx.clearRect(0, 0, 512, 140);
                if (isTarget) {
                    ctx.fillStyle = 'rgba(6, 12, 28, 0.92)';
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 6;
                    ctx.beginPath(); ctx.roundRect(12, 12, 488, 116, 18); ctx.fill(); ctx.stroke();

                    ctx.fillStyle = '#ffaa00';
                    ctx.font = 'Bold 30px "Segoe UI", sans-serif';
                    ctx.fillText(revealed ? `#${index + 1}` : '?', 30, 75);

                    ctx.font = 'Bold 40px "Segoe UI", "Noto Sans Gujarati", sans-serif';
                    ctx.fillStyle = revealed ? '#ffffff' : '#6688aa';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(textToDisplay, 280, 70);
                } else {
                    ctx.fillStyle = 'rgba(25, 8, 12, 0.88)';
                    ctx.strokeStyle = '#ff3355';
                    ctx.lineWidth = 6;
                    ctx.beginPath(); ctx.roundRect(12, 12, 488, 116, 18); ctx.fill(); ctx.stroke();

                    ctx.font = 'Bold 38px "Segoe UI", "Noto Sans Gujarati", sans-serif';
                    ctx.fillStyle = revealed ? '#ff6677' : '#aa4455';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(textToDisplay, 256, 70);
                }
            }

            drawCard(true, wordText);

            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(sharedPlaneGeo, mat);

            mesh.userData = { 
                word: wordText, 
                index: index, 
                isTarget: isTarget,
                initialPos: new THREE.Vector3(),
                canvas: canvas,
                texture: texture,
                drawCard: drawCard,
                isRevealed: false
            };
            return mesh;
        }

        function spawnDefinitionWords() {
            // Clear current words from scene
            wordObjects.forEach(m => scene.remove(m));
            wordObjects.length = 0;

            const defObj = definitionsData[currentDefKey];
            const targetWords = defObj.targetSequence;
            const decoys = defObj.decoyWords;

            targetWords.forEach((wordText, idx) => {
                const wordMesh = createGujaratiWord3D(wordText, idx, true);
                const angle = (idx / targetWords.length) * Math.PI * 2;
                const radius = 12 + (idx % 3) * 8;
                wordMesh.position.set(Math.cos(angle) * radius, 2.2, Math.sin(angle) * radius - 5);
                wordMesh.userData.initialPos.copy(wordMesh.position);
                scene.add(wordMesh);
                wordObjects.push(wordMesh);
            });

            decoys.forEach((wordText, idx) => {
                const mesh = createGujaratiWord3D(wordText, idx, false);
                mesh.position.set((Math.random() - 0.5) * 60, 2.0, (Math.random() - 0.5) * 60);
                mesh.userData.initialPos.copy(mesh.position);
                scene.add(mesh);
                wordObjects.push(mesh);
            });
        }

        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let isJoystickActive = false;
        let joystickCenter = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            isJoystickActive = true;
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            updateJoystick(touch.clientX, touch.clientY);
        });

        joystickZone.addEventListener('touchmove', (e) => {
            if (!isJoystickActive) return;
            updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
        });

        function resetJoystick() {
            isJoystickActive = false;
            moveVector = { x: 0, y: 0 };
            joystickKnob.style.transform = `translate(0px, 0px)`;
        }

        joystickZone.addEventListener('touchend', resetJoystick);
        joystickZone.addEventListener('touchcancel', resetJoystick);

        function updateJoystick(clientX, clientY) {
            const maxDist = 30;
            let dx = clientX - joystickCenter.x;
            let dy = clientY - joystickCenter.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveVector.x = dx / maxDist;
            moveVector.y = dy / maxDist;
        }

        let cameraAngleY = 0;
        let cameraAngleX = 0.38;
        let isDraggingCamera = false;
        let prevTouch = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            if (e.clientY > window.innerHeight - 110 && e.clientX < 110) return;
            isDraggingCamera = true;
            prevTouch = { x: e.clientX, y: e.clientY };
            checkClickCollect(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingCamera) return;
            const dx = e.clientX - prevTouch.x;
            const dy = e.clientY - prevTouch.y;
            cameraAngleY -= dx * 0.005;
            cameraAngleX = Math.max(0.12, Math.min(0.85, cameraAngleX + dy * 0.0035));
            prevTouch = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => isDraggingCamera = false);

        window.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            if (touch.clientY > window.innerHeight - 110 && touch.clientX < 110) return;
            isDraggingCamera = true;
            prevTouch = { x: touch.clientX, y: touch.clientY };
            checkClickCollect(touch.clientX, touch.clientY);
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDraggingCamera) return;
            const touch = e.touches[0];
            const dx = touch.clientX - prevTouch.x;
            const dy = touch.clientY - prevTouch.y;
            cameraAngleY -= dx * 0.006;
            cameraAngleX = Math.max(0.12, Math.min(0.85, cameraAngleX + dy * 0.004));
            prevTouch = { x: touch.clientX, y: touch.clientY };
        });

        window.addEventListener('touchend', () => isDraggingCamera = false);

        function checkClickCollect(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(wordObjects, true);

            if (intersects.length > 0) {
                let hitObj = intersects[0].object;
                while (hitObj.parent && !hitObj.userData.word) {
                    hitObj = hitObj.parent;
                }
                if (hitObj && hitObj.visible) {
                    tryCollectWord(hitObj);
                }
            }
        }

        function tryCollectWord(item) {
            if (isProcessingPenalty) return;

            if (currentLevel === 5 && !item.userData.isRevealed) return;

            const targetSeq = definitionsData[currentDefKey].targetSequence;
            const wordFound = item.userData.word;

            if (item.userData.isTarget && wordFound === targetSeq[currentIndex]) {
                collectedWords.push(wordFound);
                currentIndex++;
                item.visible = false;
                updateHUD();
            } else {
                if (currentLevel >= 2 && collectedWords.length > 0) {
                    isProcessingPenalty = true;

                    const droppedWordText = collectedWords.pop();
                    currentIndex = Math.max(0, currentIndex - 1);

                    const droppedMesh = wordObjects.find(w => w.userData.word === droppedWordText && w.userData.isTarget && !w.visible);
                    if (droppedMesh) {
                        droppedMesh.visible = true;
                    }

                    showToast(`⚠️ ખોટો શબ્દ! ફક્ત છેલ્લો શબ્દ "${droppedWordText}" પાછો જમીન પર ફેંકાયો!`);

                    setTimeout(() => { isProcessingPenalty = false; }, 1500);
                } else {
                    isProcessingPenalty = true;
                    showToast(`ખોટો શબ્દ: "${wordFound}"! સાચો ક્રમ અનુસરો.`);
                    setTimeout(() => { isProcessingPenalty = false; }, 1500);
                }
                updateHUD();
            }
        }

            if (currentLevel < 5) {
                currentLevel++;
            } else {
                currentLevel = 1;
            }
            resetLevelState();
        }

        function resetLevelState() {
            currentIndex = 0;
            collectedWords = [];
            isProcessingPenalty = false;

            document.getElementById('level-select').value = currentLevel;
            if (currentLevel === 1) document.getElementById('level-title').innerText = "સાચી વ્યાખ્યા શોધો";
            if (currentLevel === 2) document.getElementById('level-title').innerText = "ખોટા શબ્દથી શબ્દ ગુમાવવો";
            if (currentLevel === 3) document.getElementById('level-title').innerText = "યાદશક્તિ ટેસ્ટ (કોઈ હિન્ટ નહીં)";
            if (currentLevel === 4) document.getElementById('level-title').innerText = "કઠિન ભૂતિયા વર્ગખંડ";
            if (currentLevel === 5) document.getElementById('level-title').innerText = "લેવલ ૫: અવરોધો અને છુપાયેલા શબ્દો";

            obstacleGroup.visible = (currentLevel === 5);

            wordObjects.forEach(mesh => {
                mesh.visible = true;
                if (currentLevel === 5) {
                    mesh.userData.isRevealed = false;
                    mesh.userData.drawCard(false, "???");
                    mesh.userData.texture.needsUpdate = true;
                } else {
                    mesh.userData.isRevealed = true;
                    mesh.userData.drawCard(true, mesh.userData.word);
                    mesh.userData.texture.needsUpdate = true;
                }
            });

            avatarGroup.position.set(0, 0.2, 20);
            updateHUD();
        }

        // --- 8. LEVEL 5 OBSTACLES ---
        const deskMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: 0.8 });
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x222226, roughness: 0.5, metalness: 0.8 });

        function createDeskChairPair(x, z) {
            const deskGroup = new THREE.Group();
            deskGroup.position.set(x, 0, z);

            const top = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.12, 1.4), deskMat);
            top.position.y = 1.3;
            deskGroup.add(top);

            [-1.0, 1.0].forEach(lx => {
                [-0.5, 0.5].forEach(lz => {
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.3), metalMat);
                    leg.position.set(lx, 0.65, lz);
                    deskGroup.add(leg);
                });
            });

            obstacleGroup.add(deskGroup);
            obstacleColliders.push({ x: x, z: z, radius: 1.8 });
        }

        for (let row = -2; row <= 2; row++) {
            for (let col = -2; col <= 2; col++) {
                if (row === 0 && col === 0) continue;
                createDeskChairPair(col * 10, row * 10 - 5);
            }
        }
        obstacleGroup.visible = false;

        // --- 9. MAIN ANIMATION & RENDERING LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            flickeringLights.forEach((light, i) => {
                light.intensity = 1.8 + Math.sin(time * 10 + i) * 0.3;
            });

            let moveX = moveVector.x;
            let moveZ = moveVector.y;

            if (keys.w) moveZ = -1;
            if (keys.s) moveZ = 1;
            if (keys.a) moveX = -1;
            if (keys.d) moveX = 1;

            const isMoving = (moveX !== 0 || moveZ !== 0);

            if (isMoving) {
                const speed = 8.5 * delta;
                const forward = new THREE.Vector3(-Math.sin(cameraAngleY), 0, -Math.cos(cameraAngleY)).normalize();
                const right = new THREE.Vector3(Math.cos(cameraAngleY), 0, -Math.sin(cameraAngleY)).normalize();

                const nextPos = avatarGroup.position.clone();
                nextPos.addScaledVector(forward, -moveZ * speed);
                nextPos.addScaledVector(right, moveX * speed);

                let canMove = true;
                if (currentLevel === 5) {
                    for (let obs of obstacleColliders) {
                        const dist = Math.hypot(nextPos.x - obs.x, nextPos.z - obs.z);
                        if (dist < obs.radius) {
                            canMove = false; break;
                        }
                    }
                }

                if (canMove) {
                    avatarGroup.position.copy(nextPos);
                }

                // Character rotation: Back faces camera when moving forward away from camera
                const moveAngle = Math.atan2(-moveX, -moveZ) + cameraAngleY;
                avatarGroup.rotation.y = moveAngle;

                avatarGroup.position.x = Math.max(-38, Math.min(38, avatarGroup.position.x));
                avatarGroup.position.z = Math.max(-38, Math.min(38, avatarGroup.position.z));

                leftArmGroup.rotation.x = Math.sin(time * 10) * 0.45;
                rightArmGroup.rotation.x = -Math.sin(time * 10) * 0.45;
                leftLegGroup.rotation.x = -Math.sin(time * 10) * 0.55;
                rightLegGroup.rotation.x = Math.sin(time * 10) * 0.55;
                slothCape.rotation.x = 0.22 + Math.sin(time * 12) * 0.12;
            } else {
                leftArmGroup.rotation.x = Math.sin(time * 2) * 0.08;
                rightArmGroup.rotation.x = -Math.sin(time * 2) * 0.08;
                leftLegGroup.rotation.x = 0; rightLegGroup.rotation.x = 0;
                slothCape.rotation.x = 0.22 + Math.sin(time * 3) * 0.04;
            }

            avatarGroup.position.y = 0.2 + Math.abs(Math.sin(time * 8)) * (isMoving ? 0.14 : 0.04);

            const camDist = 9.0;
            const camX = avatarGroup.position.x + camDist * Math.sin(cameraAngleY) * Math.cos(cameraAngleX);
            const camY = avatarGroup.position.y + camDist * Math.sin(cameraAngleX) + 1.4;
            const camZ = avatarGroup.position.z + camDist * Math.cos(cameraAngleY) * Math.cos(cameraAngleX);

            camera.position.set(camX, camY, camZ);
            camera.lookAt(avatarGroup.position.x, avatarGroup.position.y + 1.2, avatarGroup.position.z);

            const targetSeq = definitionsData[currentDefKey].targetSequence;
            let targetObject = null;

            wordObjects.forEach((item, index) => {
                if (!item.visible) return;

                item.lookAt(camera.position);
                item.position.y = 2.2 + Math.sin(time * 2.8 + index) * 0.25;

                if (item.userData.isTarget && item.userData.word === targetSeq[currentIndex]) {
                    targetObject = item;
                }

                const distToPlayer = item.position.distanceTo(avatarGroup.position);

                if (currentLevel === 5) {
                    if (distToPlayer < 6.5 && !item.userData.isRevealed) {
                        item.userData.isRevealed = true;
                        item.userData.drawCard(true, item.userData.word);
                        item.userData.texture.needsUpdate = true;
                    }
                }

                if (distToPlayer < 3.2) {
                    tryCollectWord(item);
                }
            });

            if (targetObject && currentLevel < 3) {
                const dx = targetObject.position.x - avatarGroup.position.x;
                const dz = targetObject.position.z - avatarGroup.position.z;

                let targetAngle = Math.atan2(dx, dz);
                let diffAngle = targetAngle - cameraAngleY;

                const compassArrow = document.getElementById('compass-arrow');
                if (compassArrow) {
                    compassArrow.style.transform = `rotate(${diffAngle * (180 / Math.PI)}deg)`;
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = function() {
            buildEnvironment('school');
            spawnDefinitionWords();
            updateHUD();
            animate();
        };
    </script>
